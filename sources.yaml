# 職缺來源設定
#
# 每個來源的欄位：
#   name       唯一代號（小寫英數、- 或 _），用在紀錄與警告訊息
#   company    公司名稱
#   url        招募網站網址，系統會自動辨識是 Workday / Greenhouse / Lever / Ashby / 其他
#   locations  只保留這些地區的職缺（比對職缺地點，不分大小寫）
#   keywords   職稱或職缺描述含任一關鍵字才保留；留空 = 不限
#   exclude    職稱含任一排除詞就略過
#   type       選填；自動辨識錯誤時手動指定：workday / greenhouse / lever / ashby / generic

sources:
  - name: abbott
    company: Abbott
    url: https://abbott.wd5.myworkdayjobs.com/abbottcareers
    locations: [Singapore, Taiwan]
    keywords: []
    exclude: []
