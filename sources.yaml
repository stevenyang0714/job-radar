# 職缺來源設定
#
# 篩選條件分三層，依序合併：defaults（全部共用）→ groups（產業分組）→ 各來源自己的設定
#   locations  只保留這些地區的職缺；後面的層有寫就取代前面的
#   keywords   職稱或職缺內容含任一關鍵字才保留；後面的層有寫就取代前面的；最後是空的 = 不限
#   exclude    職稱含任一排除詞就略過；三層的排除詞會累加
#   exclude_description  職缺內容含任一詞就略過（例如限新加坡公民）；三層累加
#
# sources：每個來源
#   name / company / url 必填；group 選填（finance / tech / ai / healthcare）
#   locations / keywords / exclude 選填，用來覆寫或追加這家公司的條件
#   type  選填；自動辨識錯誤時手動指定：workday / greenhouse / lever / ashby / mycareersfuture / generic
#   searches / min_salary  只有 MyCareersFuture 這類搜尋型來源用得到
#   aliases  選填；公司的其他名稱（例如 Citi 在 MCF 上叫 CITIBANK），用來略過 MCF 上已有專屬來源的公司
#
# 比對規則：不分大小寫；英文以完整單字比對（AI 不會比對到 maintain），中文以字串比對
# 新增公司前，可以先用 `uv run jobradar detect <網址>` 確認系統類型

defaults:
  # profile.md：台灣、新加坡、香港；澳洲（可贊助工作簽證）、日本（不需日文）只通知近期新刊登（見 settings.yaml）
  locations: [Taiwan, Singapore, Hong Kong, Australia, Japan]

  # profile.md 第 4 節：排除條件（所有產業都適用）
  exclude:
    - intern
    - internship
    - part-time
    - part time
    - software engineer
    - data engineer
    - machine learning engineer
    - ML engineer
    - developer
    - nurse
    - pharmacist
    - physician

  # 限新加坡公民／永久居民的職缺無法辦 EP
  exclude_description:
    - Singaporeans only
    - Singaporean only
    - Singapore Citizens only
    - Singapore Citizen only
    - Singaporeans and PRs only
    - Singaporeans/PRs only
    - Singaporean/PR only
    - Singapore Citizens and PRs only
    - Singapore Citizens or PRs only
    - Singapore Citizens/PRs only
    - SC/PR only
    - SC/SPR only
    - only Singaporeans
    - only Singapore Citizens
    # 澳洲：要求當地工作權或不提供簽證贊助
    - full working rights
    - full Australian working rights
    - unrestricted working rights
    - Australian citizens or permanent residents
    - Australian citizen or permanent resident
    - must be an Australian citizen
    - must have Australian citizenship
    - Australian citizenship is required
    - no visa sponsorship
    - visa sponsorship is not available
    - unable to provide visa sponsorship
    - unable to offer visa sponsorship
    - not able to sponsor
    - cannot sponsor
    - will not sponsor
    # 日本：要求日文能力
    - fluent Japanese
    - fluency in Japanese
    - native Japanese
    - native-level Japanese
    - business level Japanese
    - business-level Japanese
    - Japanese (native
    - Japanese (business
    - "Japanese: native"
    - "Japanese: business"
    - JLPT N1
    - JLPT N2
    - 日本語

groups:
  # 金融：AI 治理、科技風險、資安（Track A），以及策略與轉型
  finance:
    keywords:
      - AI
      - artificial intelligence
      - governance
      - risk
      - technology risk
      - cyber
      - information security
      - CISO
      - BISO
      - compliance
      - controls
      - transformation
      - change
      - digital
      - data
      - strategy
      - strategic
      - planning
      - product manager
      - solutions
      - partnerships
      - business development
      - 數位
      - 轉型
      - 策略
      - 治理
      - 風險
      - 資安
      - 經營管理

  # 金融科技／加密貨幣：風險合規（Track A）＋業務開發與合作夥伴（Track C）都相關
  fintech:
    keywords:
      - AI
      - governance
      - risk
      - compliance
      - cyber
      - information security
      - transformation
      - strategy
      - strategic
      - product manager
      - program manager
      - solutions
      - business development
      - partnerships
      - partner manager
      - alliances
      - channel
      - account manager
      - account executive
      - account director
      - customer success
      - go-to-market
      - GTM

  # 科技：客戶、業務開發、合作夥伴、解決方案、策略營運、專案與產品（Track C、D）
  tech:
    keywords:
      - account manager
      - account executive
      - account director
      - business development
      - partnerships
      - partner
      - alliances
      - solutions
      - customer success
      - customer solutions
      - sales
      - go-to-market
      - GTM
      - strategy
      - strategic
      - operations
      - program manager
      - programme manager
      - product manager
      - planning
      - AI
      - cloud
      - security
      - privacy
      - healthcare
      - 業務
      - 專案經理
      - 策略

  # 純 AI 公司：工程以外的商業、導入、營運、治理職位幾乎都相關
  ai:
    keywords:
      - account
      - business development
      - partnerships
      - solutions
      - customer
      - outcome
      - success
      - go-to-market
      - GTM
      - strategy
      - operations
      - program
      - consulting
      - advisor
      - sales
      - field
      - delivery
      - governance
      - policy
      - risk
      - trust

  # 醫藥：藥廠／醫材裡偏數位、數據、AI、轉型的職位（Track B）
  healthcare:
    keywords:
      - digital
      - digital health
      - AI
      - artificial intelligence
      - data
      - analytics
      - business intelligence
      - transformation
      - innovation
      - technology
      - governance
      - strategy
      - strategic
      - commercial excellence
      - market access
      - consulting
      - consultant
      - program manager
      - project management
      - change management
    exclude:
      # 純業務職（profile.md：與 AI、科技、顧問無關的純業務職）
      - sales representative
      - sales specialist
      - medical representative

sources:
  # ── 新加坡 MyCareersFuture（政府求職網站）──
  # 公司為外籍人士申請 EP 前，大多數職缺須先刊登在這裡，且一定標示薪資，涵蓋所有在新加坡徵人的公司（含新創）
  - name: mcf
    company: MyCareersFuture
    url: https://www.mycareersfuture.gov.sg/
    locations: [Singapore]
    min_salary: 10000  # 月薪上限至少 SGD 10,000
    # MCF 搜尋比較寬，會撈到很多純技術職；engineer 以完整單字比對，Engineering Manager 不受影響
    exclude: [engineer]
    searches:
      # Track A：AI 治理、科技風險、資安
      - AI governance
      - responsible AI
      - technology risk
      - cyber risk
      - information security governance
      # Track B：醫療數位轉型
      - digital health
      - healthcare digital transformation
      - pharma digital
      - market access
      - commercial excellence
      # Track C：AI 導入、解決方案、商業化
      - AI business development
      - AI partnerships
      - AI solutions
      - AI customer success
      - go-to-market
      # Track D：策略、轉型專案管理
      - digital transformation
      - strategy and operations
      - transformation office
      - chief of staff
      - AI program manager
      # 業務開發、客戶與合作夥伴
      - business development
      - account manager
      - account executive
      - account director
      - partner manager
      - channel manager
      - alliances

  # ── YC 新加坡（Y Combinator 官方職缺頁，YC 新創在新加坡的最新職缺）──
  - name: yc
    company: Y Combinator
    group: ai
    url: https://www.ycombinator.com/jobs/location/singapore
    locations: [Singapore]
    # YC 職缺以工程為主；engineer 以完整單字比對，Engineering Manager 不受影響
    exclude: [engineer, designer]

  # ── 日本：不需日文的職缺（只通知近期新刊登；內容是日文的職缺會自動排除）──
  - name: japandev
    company: Japan Dev
    group: tech
    url: https://japan-dev.com/jobs-in-japan-for-english-speakers
    locations: [Japan]
    exclude: [engineer, developer, designer, writer]

  - name: michaelpage
    company: Michael Page
    url: https://www.michaelpage.co.jp/en/jobs?language%5B0%5D=en
    locations: [Japan]
    exclude: [engineer, developer]
    # 仲介職缺橫跨各產業，用四條求職方向的核心詞篩選
    keywords: [AI, governance, risk, compliance, cyber, security, privacy, digital, transformation, strategy, strategic,
               business development, partnerships, alliances, product manager, program manager, programme manager,
               project manager, consultant, consulting, solutions, customer success, account director, market access,
               commercial excellence]

