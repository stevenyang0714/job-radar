[project]
name = "job-radar"
version = "0.1.0"
description = "個人職缺監控：抓取職缺、去重、LLM 評分、Telegram 推播"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=2",
    "pydantic>=2.7",
    "pypdf>=5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]
