name: Job radar

on:
  schedule:
    # 每天 UTC 18:07 = 台灣 02:07 觸發，再由 gate 決定今天要不要真的跑。
    # 避開整點與 UTC 午夜（台灣 08:00）：那是 GitHub 排程最擁擠的時段，實測延遲將近 6 小時
    - cron: "7 18 * * *"
  workflow_dispatch: # 在 Actions 頁面按 Run workflow 手動執行
    inputs:
      digest:
        description: 這次也發摘要
        type: boolean
        default: true

concurrency:
  group: job-radar # 同一時間只跑一個，避免重複推播
  cancel-in-progress: false

jobs:
  # 排程每 RUN_EVERY_DAYS 天才真的執行一次（以台灣日期計算，間隔固定，排程延遲也不會算錯日）；手動執行不受影響
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          RUN_EVERY_DAYS: 3
          EVENT: ${{ github.event_name }}
        run: |
          day=$(( ($(date -u +%s) + 8 * 3600) / 86400 ))  # 台灣日期（UTC+8）
          if [ "$EVENT" = "schedule" ] && [ $(( day % RUN_EVERY_DAYS )) -ne 0 ]; then
            echo "今天不是執行日（每 $RUN_EVERY_DAYS 天執行一次）"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # 依 .python-version 安裝 Python 3.11，GitHub 主機上預設啟用快取

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run job radar
        run: uv run --no-dev jobradar run --trigger "$TRIGGER" $DIGEST_FLAG
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DIGEST_FLAG: ${{ inputs.digest && '--digest' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # 整個執行失敗（程式錯誤、金鑰錯誤、Telegram 發送失敗等）時另外通知，不會安靜失敗
      - name: Notify failure
        if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 job-radar 執行失敗，請查看：${RUN_URL}" > /dev/null
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
